<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>002 しましま草刈り | 100 Games</title>
  <meta name="theme-color" content="#fff7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141a" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../../shared/game.css">
  <style>
    .game-header .spacer { flex: 1; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: var(--space-4);
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      backdrop-filter: blur(3px);
      overflow-y: auto;
    }
    .overlay[hidden] { display: none; }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hover);
      padding: var(--space-5);
      animation: pop 320ms var(--ease-out);
    }
    @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    .card h2 { margin: 0 0 var(--space-1); font-size: 1.6rem; }
    .card .lead { margin: 0 0 var(--space-4); color: var(--muted); }
    .stages { list-style: none; margin: 0 0 var(--space-4); padding: 0; display: grid; gap: var(--space-2); }
    .stage-btn {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--space-3);
      min-height: 56px;
      padding: var(--space-2) var(--space-3);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color var(--dur) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .stage-btn:hover:not(:disabled) { border-color: var(--accent); }
    .stage-btn:active:not(:disabled) { transform: scale(0.98); }
    .stage-btn:disabled { cursor: not-allowed; opacity: 0.55; }
    .stage-btn .num {
      font: 700 1.2rem/1 var(--font-display);
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-ink);
    }
    .stage-btn .name { font-weight: 700; line-height: 1.3; }
    .stage-btn .name small { display: block; font-weight: 500; color: var(--muted); font-size: 0.8rem; }
    .stage-btn .rec { font: 600 0.85rem/1.3 var(--font-display); color: var(--muted); text-align: right; }
    .stage-btn .rec.clear { color: var(--accent-ink); }
    .ba { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin: 0 0 var(--space-4); }
    .ba figure { margin: 0; }
    .ba canvas { width: 100%; height: auto; display: block; border-radius: var(--radius-sm); border: 2px solid var(--border); }
    .ba figcaption { font: 600 0.8rem/1.6 var(--font-display); color: var(--muted); text-align: center; }
    .stats { margin: 0 0 var(--space-4); display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-4); }
    .stats dt { color: var(--muted); }
    .stats dd { margin: 0; font: 600 1.05rem/1.6 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
    .stats .new { color: var(--accent-ink); font-size: 0.8rem; margin-left: var(--space-2); }
    .upgrade {
      margin: 0 0 var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--fg);
      font-weight: 700;
    }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; }
  </style>
</head>
<body>
  <header class="game-header">
    <a class="btn btn-ghost" href="../../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      一覧へ
    </a>
    <h1><span class="no">002</span>しましま草刈り</h1>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="mute" type="button" aria-pressed="false">音 ON</button>
  </header>
  <main class="game-stage">
    <canvas class="game" id="game" tabindex="0" aria-label="ゲーム画面：伸び放題の庭を草刈り機で刈る"></canvas>
  </main>
  <section class="game-help" aria-label="遊び方">
    <p>伸び放題の草を刈って、庭をしましまの芝生にしよう。画面を<strong>ドラッグ</strong>した方向へ草刈り機が進む。<kbd>WASD</kbd> / <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> でも動かせる。</p>
    <p>区画を刈り切るとチャイム。刈った向きで芝の色が変わるので、まっすぐ往復すると縞模様がきれいに出る。制限時間はなし。<kbd>P</kbd> 一時停止 ／ <kbd>M</kbd> 音のオン・オフ</p>
  </section>
  <div class="overlay" id="overlay" hidden></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
