<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>003 ハンドドリップ珈琲 | 100 Games</title>
  <meta name="theme-color" content="#fff7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141a" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../../shared/game.css">
  <style>
    .game-header .spacer { flex: 1; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: var(--space-4);
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      backdrop-filter: blur(3px);
      overflow-y: auto;
    }
    .overlay[hidden] { display: none; }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hover);
      padding: var(--space-5);
      animation: pop 320ms var(--ease-out);
    }
    @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    .card h2 { margin: 0 0 var(--space-1); font-size: 1.6rem; }
    .card .lead { margin: 0 0 var(--space-4); color: var(--muted); }
    .choices { list-style: none; margin: 0 0 var(--space-4); padding: 0; display: grid; gap: var(--space-2); }
    .choice {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--space-3);
      min-height: 56px;
      padding: var(--space-2) var(--space-3);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color var(--dur) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .choice:hover { border-color: var(--accent); }
    .choice:active { transform: scale(0.98); }
    .choice .dots { display: flex; gap: 3px; width: 44px; flex-wrap: wrap; justify-content: center; }
    .choice .dots i { display: block; border-radius: 50%; background: #6b4226; }
    .choice .name { font-weight: 700; line-height: 1.3; }
    .choice .name small { display: block; font-weight: 500; color: var(--muted); font-size: 0.8rem; }
    .choice .rec { font: 600 0.85rem/1.3 var(--font-display); color: var(--accent-ink); text-align: right; white-space: pre; }
    .cup { display: block; width: 100%; max-width: 320px; height: auto; margin: 0 auto var(--space-3); }
    .score { text-align: center; margin: 0 0 var(--space-4); font: 700 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
    .score small { font-size: 1rem; color: var(--muted); margin-left: 4px; }
    .score .stars { display: block; font-size: 1.2rem; letter-spacing: 4px; color: var(--gold); margin-top: var(--space-2); }
    .meters { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-3); align-items: center; margin: 0 0 var(--space-4); }
    .meters .label { font-weight: 700; font-size: 0.9rem; }
    .meter { position: relative; height: 12px; border-radius: 6px; background: var(--bg-deep); overflow: hidden; }
    .meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--accent); }
    .taste { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #f2c14e, #8fbf5a 42%, #8fbf5a 58%, #6b4226); }
    .taste > span { position: absolute; top: -4px; width: 6px; height: 20px; margin-left: -3px; border-radius: 3px; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); }
    .taste-ends { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); grid-column: 2; margin-top: -6px; }
    .stats { margin: 0 0 var(--space-4); display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-4); }
    .stats dt { color: var(--muted); }
    .stats dd { margin: 0; font: 600 1.05rem/1.6 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
    .stats .new { color: var(--accent-ink); font-size: 0.8rem; margin-left: var(--space-2); }
    .tip {
      margin: 0 0 var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--fg);
      font-weight: 700;
    }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; }
  </style>
</head>
<body>
  <header class="game-header">
    <a class="btn btn-ghost" href="../../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      一覧へ
    </a>
    <h1><span class="no">003</span>ハンドドリップ珈琲</h1>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="mute" type="button" aria-pressed="false">音 ON</button>
  </header>
  <main class="game-stage">
    <canvas class="game" id="game" tabindex="0" aria-label="ゲーム画面：手挽きミルで豆を挽き、ドリッパーにお湯を注いでコーヒーを淹れる"></canvas>
  </main>
  <section class="game-help" aria-label="遊び方">
    <p><strong>① 挽く</strong>：ミルのまわりを<strong>ぐるぐるドラッグ</strong>（時計回り）してハンドルを回す。<kbd>Space</kbd> 長押しでも回せる。ゆっくり一定のペースで回すと粒がそろう。</p>
    <p><strong>② 蒸らす・③ 注ぐ</strong>：<strong>押しているあいだ</strong>ケトルからお湯が出る。指（マウス）の位置に注ぐ。<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> で移動・<kbd>Space</kbd> で注ぐ。少し注いで全体を湿らせたら、しばらく待って蒸らす。あとは中心から「の」の字に、水位が下がったら次を注ぐ。</p>
    <p><kbd>Enter</kbd> できあがり ／ <kbd>P</kbd> 一時停止 ／ <kbd>M</kbd> 音のオン・オフ</p>
  </section>
  <div class="overlay" id="overlay" hidden></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
