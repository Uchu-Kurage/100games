<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100 Games</title>
  <link rel="stylesheet" href="./shared/game.css">
  <style>
    body { align-items: stretch; max-width: 960px; margin: 0 auto; }
    .hero h1 { font-size: 2rem; margin: 8px 0 4px; }
    .hero p { color: var(--muted); margin: 0; }
    .progress {
      height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 12px;
    }
    .progress > div { height: 100%; background: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      padding: 0;
      margin: 8px 0 0;
      list-style: none;
    }
    .card {
      display: block;
      height: 100%;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: var(--accent); }
    .card .no { color: var(--accent); font-weight: bold; font-variant-numeric: tabular-nums; }
    .card h2 { font-size: 1.05rem; margin: 4px 0 6px; }
    .card p { color: var(--muted); font-size: 0.85rem; margin: 0 0 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); }
    .card.empty { opacity: 0.45; border-style: dashed; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>100 Games</h1>
    <p>ゲーム製作修行：ブラウザで遊べるミニゲームを100本作る</p>
    <p id="count"></p>
    <div class="progress"><div id="bar" style="width:0"></div></div>
  </header>
  <main>
    <ul class="grid" id="list"></ul>
  </main>

  <script type="module">
    const TOTAL = 100;
    const list = document.getElementById('list');

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    try {
      const res = await fetch('./games.json');
      const games = await res.json();
      const byNo = new Map(games.map((g) => [g.no, g]));

      document.getElementById('count').textContent = `${games.length} / ${TOTAL} 本 完成`;
      document.getElementById('bar').style.width = `${(games.length / TOTAL) * 100}%`;

      for (let no = 1; no <= TOTAL; no++) {
        const g = byNo.get(no);
        const li = el('li');
        const num = String(no).padStart(3, '0');
        if (g) {
          const a = el('a', 'card');
          a.href = `./games/${g.id}/`;
          a.append(el('span', 'no', num), el('h2', '', g.title), el('p', '', g.description));
          const tags = el('div', 'tags');
          (g.tags || []).forEach((t) => tags.append(el('span', 'tag', t)));
          a.append(tags);
          li.append(a);
        } else {
          const d = el('div', 'card empty');
          d.append(el('span', 'no', num), el('h2', '', '???'));
          li.append(d);
        }
        list.append(li);
      }
    } catch (e) {
      list.append(el('li', '', 'games.json を読み込めませんでした。ローカルでは簡易サーバー経由で開いてください（README 参照）。'));
    }
  </script>
</body>
</html>
